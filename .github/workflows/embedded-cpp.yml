name: Embedded C++ host tests
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cmake -S cpp -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
