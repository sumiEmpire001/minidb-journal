[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lord-sumi-minidb-journal"
version = "0.1.0"
description = "Educational checksummed append-only key-value journal"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
minidb = "minidb.__main__:main"

[tool.setuptools.packages.find]
include = ["minidb*"]
